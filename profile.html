<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skill Passport - SkillMatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Skill Passport</h1>

        <p>Create your profile and showcase your skills.</p>

        <form id="skillForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>College</label>
            <input type="text" id="college" placeholder="Enter your college">

            <label>Branch</label>
            <input type="text" id="branch" placeholder="Enter your branch">

            <label>Skills</label>
            <input type="text" id="skills" placeholder="Example: Java, HTML, CSS, JavaScript">

            <label>Projects</label>
            <textarea id="projects" placeholder="Describe your projects"></textarea>

            <label>Certificates</label>
            <textarea id="certificates" placeholder="Enter your certificates"></textarea>

            <button type="submit">Create Skill Passport</button>

        </form>

    </div>

    <div id="passport"></div>

<script src="js/script.js"></script>
</body>
</html>
